<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yash Shinde — Graphic Designer & Art Director</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#0A0A0F;
  --bg-alt:#0D0D13;
  --surface:#131318;
  --surface-2:#17171f;
  --border:rgba(255,255,255,.09);
  --border-strong:rgba(255,255,255,.16);
  --text:#F3F2F7;
  --text-dim:#9c9ca8;
  --text-faint:#5e5e6b;
  --accent:#8c52ff;
  --accent-light:#a98cff;
  --accent-soft:rgba(140,82,255,.14);
  --accent-line:rgba(140,82,255,.35);
  --font-head:'Oswald',sans-serif;
  --font-body:'Space Grotesk',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --container:1280px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0;}
html{scroll-behavior:smooth;scroll-padding-top:88px;height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  min-height:100%;
}
img{max-width:100%;display:block;}
button,input,select,textarea{font-family:inherit;color:inherit;}
a{color:inherit;text-decoration:none;}
.container{max-width:var(--container);margin:0 auto;padding:0 clamp(20px,5vw,64px);}
::selection{background:var(--accent);color:#fff;}

@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto;}
  *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}

/* focus visibility */
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--accent-light);
  outline-offset:3px;
  border-radius:2px;
}

/* ============ SHARED BITS ============ */
.eyebrow{
  display:flex;align-items:center;gap:12px;
  font-family:var(--font-mono);
  font-size:12px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--text-dim);
  margin-bottom:18px;
}
.eyebrow .idx{color:var(--accent-light);}
.eyebrow .rule{width:34px;height:1px;background:var(--border-strong);}

.btn{
  display:inline-flex;align-items:center;gap:10px;
  font-family:var(--font-head);
  font-weight:600;
  font-size:14px;
  letter-spacing:.06em;
  text-transform:uppercase;
  padding:16px 26px;
  border-radius:2px;
  border:1px solid transparent;
  cursor:pointer;
  transition:transform .18s ease, background .18s ease, border-color .18s ease, color .18s ease;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn-fill{background:var(--accent);color:#fff;}
.btn-fill:hover{background:var(--accent-light);}
.btn-outline{background:transparent;border-color:var(--border-strong);color:var(--text);}
.btn-outline:hover{border-color:var(--accent-light);color:var(--accent-light);}
.btn-sm{padding:12px 18px;font-size:12px;}

/* reveal-on-scroll */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.16,.8,.3,1), transform .7s cubic-bezier(.16,.8,.3,1);}
.reveal.is-visible{opacity:1;transform:translateY(0);}
.reveal-stagger > * {transition-delay:calc(var(--i,0) * 70ms);}

/* ============ NAVBAR ============ */
.navbar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding-top:env(safe-area-inset-top,0px);
  background:rgba(10,10,15,.72);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.navbar::before{
  content:'';display:block;height:2px;width:100%;
  background:linear-gradient(90deg,var(--accent),transparent 60%);
}
.nav-inner{
  display:flex;align-items:center;justify-content:space-between;
  height:76px;
}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{
  width:34px;height:34px;flex:none;
  background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-head);font-weight:700;font-size:16px;
  border-radius:3px;color:#fff;
}
.brand-name{
  font-family:var(--font-head);font-weight:600;font-size:17px;
  letter-spacing:.03em;text-transform:uppercase;
}
.nav-links{
  display:flex;align-items:center;gap:34px;
  list-style:none;
}
.nav-links a{
  font-family:var(--font-mono);
  font-size:13px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--text-dim);
  transition:color .15s ease;
  display:flex;gap:6px;align-items:baseline;
}
.nav-links a .n{color:var(--accent-light);}
.nav-links a:hover{color:var(--text);}
.nav-cta{display:flex;}
.nav-toggle{
  display:none;background:none;border:1px solid var(--border-strong);
  width:42px;height:42px;border-radius:2px;
  align-items:center;justify-content:center;
  flex-direction:column;gap:5px;cursor:pointer;
}
.nav-toggle span{width:18px;height:2px;background:var(--text);display:block;transition:transform .2s ease, opacity .2s ease;}
.nav-toggle.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
.nav-toggle.open span:nth-child(2){opacity:0;}
.nav-toggle.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}

.mobile-panel{
  display:none;
  position:fixed;inset:76px 0 0 0;
  background:var(--bg);
  z-index:99;
  padding:32px clamp(20px,6vw,64px);
  overflow-y:auto;
}
.mobile-panel.open{display:block;}
.mobile-panel ul{list-style:none;display:flex;flex-direction:column;gap:0;}
.mobile-panel li{border-bottom:1px solid var(--border);}
.mobile-panel a{
  display:flex;gap:12px;align-items:baseline;padding:20px 0;
  font-family:var(--font-head);font-size:22px;text-transform:uppercase;letter-spacing:.02em;
}
.mobile-panel a .n{font-family:var(--font-mono);font-size:13px;color:var(--accent-light);}
.mobile-panel .btn{margin-top:28px;width:100%;justify-content:center;}

@media (max-width:920px){
  .nav-links{display:none;}
  .nav-toggle{display:flex;}
}

/* ============ HERO ============ */
.hero{
  position:relative;
  padding:calc(76px + 96px) 0 96px;
  overflow:hidden;
  min-height:92vh;
  display:flex;align-items:center;
}
.hero-bg{
  position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 60% 55% at 78% 38%, rgba(140,82,255,.22), transparent 60%),
    linear-gradient(120deg, #0A0A0F 0%, #0c0c13 42%, #100c1c 100%);
}
.hero-bg svg{position:absolute;right:-8%;top:0;height:100%;width:70%;opacity:.55;}
.hero-bg::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(10,10,15,.15) 0%, rgba(10,10,15,.55) 72%, var(--bg) 100%);
}
.hero-inner{position:relative;z-index:1;max-width:900px;}
.hero-eyebrow{
  display:flex;align-items:center;gap:14px;
  font-family:var(--font-mono);font-size:13px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--accent-light);margin-bottom:26px;
}
.hero-eyebrow .rule{width:44px;height:2px;background:var(--accent);}
.hero h1{
  font-family:var(--font-head);
  font-weight:700;
  text-transform:uppercase;
  font-size:clamp(42px,7.4vw,92px);
  line-height:.98;
  letter-spacing:-.01em;
}
.hero h1 .l1{color:var(--text);display:block;}
.hero h1 .l2{
  display:block;
  background:linear-gradient(95deg,var(--accent-light),var(--accent) 65%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  margin-top:4px;
}
.hero p{
  margin-top:30px;max-width:560px;
  font-size:17px;color:var(--text-dim);
  line-height:1.7;
}
.hero-actions{display:flex;gap:16px;flex-wrap:wrap;margin-top:42px;}

@media (max-width:600px){
  .hero{min-height:auto;padding-top:calc(76px + 64px);padding-bottom:64px;}
  .hero-actions .btn{width:100%;justify-content:center;}
  .hero-actions{flex-direction:column;}
}

/* ============ MARQUEE STRIP ============ */
.marquee-strip{
  border-top:1px solid var(--accent-line);
  border-bottom:1px solid var(--border);
  background:var(--bg-alt);
  overflow:hidden;
  padding:16px 0;
}
.marquee-track{
  display:flex;width:max-content;
  animation:marquee 34s linear infinite;
}
.marquee-track span{
  font-family:var(--font-head);
  font-size:15px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--text-faint);
  padding:0 22px;
  display:flex;align-items:center;gap:22px;
  white-space:nowrap;
}
.marquee-track span::after{content:'/';color:var(--accent);font-family:var(--font-body);}
@keyframes marquee{from{transform:translateX(0);}to{transform:translateX(-50%);}}

/* ============ SECTION SHELL ============ */
section{padding:120px 0;}
.section-head{margin-bottom:56px;}
.section-title{
  font-family:var(--font-head);
  font-weight:700;text-transform:uppercase;
  font-size:clamp(30px,4.4vw,52px);
  line-height:1.06;letter-spacing:-.01em;
  max-width:760px;
}

/* ============ ABOUT ============ */
.about-head{display:flex;justify-content:space-between;gap:40px;align-items:flex-end;margin-bottom:64px;flex-wrap:wrap;}
.about-grid{
  display:grid;
  grid-template-columns:380px 1fr;
  gap:64px;
  align-items:start;
}
.about-portrait{
  position:relative;
}
.portrait-frame{
  position:relative;
  aspect-ratio:1080/782;
  border:1px solid var(--border-strong);
  overflow:hidden;
  background:var(--surface);
}
.portrait-frame img{width:100%;height:100%;display:block;object-fit:cover;}
.portrait-frame::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--accent-light),var(--accent) 70%,transparent);
}
.stat-float{
  position:absolute;right:-18px;bottom:-24px;
  background:var(--accent);color:#fff;
  padding:20px 22px;
  width:190px;
  box-shadow:0 20px 40px -12px rgba(140,82,255,.55);
}
.stat-float .num{font-family:var(--font-head);font-weight:700;font-size:32px;line-height:1;}
.stat-float .lbl{
  margin-top:8px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.05em;
  text-transform:uppercase;line-height:1.4;opacity:.92;
}
.about-copy h3{
  font-family:var(--font-head);font-weight:700;text-transform:uppercase;
  font-size:clamp(26px,3.4vw,40px);line-height:1.12;letter-spacing:-.01em;
  max-width:640px;
}
.about-copy > p{margin-top:22px;max-width:560px;color:var(--text-dim);font-size:16px;line-height:1.75;}
.feature-cards{
  margin-top:38px;
  display:grid;grid-template-columns:repeat(3,1fr);gap:18px;
}
.feature-card{
  background:var(--surface);border:1px solid var(--border);
  padding:22px 20px;
  position:relative;
  transition:border-color .2s ease, transform .2s ease;
}
.feature-card:hover{border-color:var(--accent-line);transform:translateY(-3px);}
.feature-card .fc-num{font-family:var(--font-mono);font-size:11px;color:var(--accent-light);letter-spacing:.1em;}
.feature-card h4{
  margin-top:12px;font-family:var(--font-head);font-weight:600;font-size:15px;
  text-transform:uppercase;letter-spacing:.02em;
}
.feature-card p{margin-top:10px;font-size:13.5px;color:var(--text-dim);line-height:1.6;}

.stat-row{
  margin-top:64px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  border-top:1px solid var(--border);
}
.stat-item{padding:28px 22px 0 0;}
.stat-item .num{
  font-family:var(--font-head);font-weight:700;color:var(--accent-light);
  font-size:clamp(34px,4.4vw,52px);line-height:1;
}
.stat-item .lbl{
  margin-top:10px;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--text-dim);
}

@media (max-width:980px){
  .about-grid{grid-template-columns:1fr;}
  .about-portrait{max-width:380px;}
  .feature-cards{grid-template-columns:1fr;}
  .stat-row{row-gap:28px;}
}
@media (max-width:560px){
  section{padding:80px 0;}
  .stat-float{width:150px;right:0;bottom:-20px;padding:16px 16px;}
}

/* ============ WORK ============ */
.work-head{display:flex;justify-content:space-between;gap:40px;align-items:flex-end;margin-bottom:40px;flex-wrap:wrap;}
.work-desc{max-width:280px;font-size:14px;color:var(--text-dim);text-align:right;line-height:1.6;}
.filter-bar{
  display:flex;gap:10px;flex-wrap:wrap;
  margin-bottom:48px;
}
.filter-btn{
  font-family:var(--font-mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;
  padding:11px 18px;border-radius:999px;
  border:1px solid var(--border-strong);
  background:transparent;color:var(--text-dim);
  cursor:pointer;transition:all .18s ease;
}
.filter-btn:hover{color:var(--text);border-color:var(--accent-line);}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}

.work-grid{
  columns:3 320px;
  column-gap:24px;
}
.project-card{
  break-inside:avoid;
  margin-bottom:24px;
  border:1px solid var(--border);
  background:var(--surface);
  overflow:hidden;
  display:block;
  opacity:1;transform:none;
  cursor:pointer;
  transition:opacity .35s ease, transform .35s ease, border-color .2s ease;
}
.project-card:hover{border-color:var(--accent-line);}
.project-card.hidden{display:none;}
.thumb{
  position:relative;
  width:100%;
  overflow:hidden;
}
.thumb svg, .thumb img{
  width:100%;height:100%;display:block;
  object-fit:contain;
  background:var(--bg-alt);
  filter:grayscale(1) contrast(1.02);
  transform:scale(1.001);
  transition:filter .5s ease, transform .6s ease;
}
.project-card:hover .thumb svg{
  filter:grayscale(0);
  transform:scale(1.045);
}
.project-card:hover .thumb img{
  filter:grayscale(0);
  transform:scale(1);
}
.thumb::after{
  content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(to bottom, rgba(0,0,0,0) 42%, rgba(0,0,0,.82) 100%);
}
.thumb.portrait-916{
  height:auto !important;
  aspect-ratio:9/16;
}
.thumb .tag{
  position:absolute;top:14px;left:14px;z-index:2;
  background:var(--accent);color:#fff;
  font-family:var(--font-mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;
  padding:6px 11px;
}
.thumb .expand-hint{
  position:absolute;bottom:14px;right:14px;z-index:2;
  width:34px;height:34px;
  border:1px solid rgba(255,255,255,.35);
  background:rgba(10,10,15,.45);
  backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;
  color:#fff;opacity:0;transform:translateY(6px);
  transition:opacity .25s ease, transform .25s ease;
}
.thumb .expand-hint svg{width:15px;height:15px;}
.project-card:hover .expand-hint{opacity:1;transform:translateY(0);}
.card-body{padding:18px 20px 22px;}
.card-body .p-title{font-family:var(--font-head);font-weight:600;font-size:17px;text-transform:uppercase;letter-spacing:.01em;}
.card-body .p-year{
  margin-top:5px;font-family:var(--font-mono);font-size:11.5px;color:var(--accent-light);
}
.skill-tags{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;}
.skill-tags span{
  font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;
  border:1px solid var(--border-strong);color:var(--text-dim);
  padding:5px 9px;
}

@media (max-width:980px){
  .work-grid{columns:2 260px;}
  .work-desc{text-align:left;}
}
@media (max-width:620px){
  .work-grid{columns:1;}
}

/* ============ LIGHTBOX ============ */
.lightbox-overlay{
  position:fixed;inset:0;z-index:300;
  background:rgba(5,4,9,.9);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;
  padding:56px 20px;
  opacity:0;visibility:hidden;
  transition:opacity .3s ease;
}
.lightbox-overlay.open{opacity:1;visibility:visible;}
.lightbox-panel{
  position:relative;
  width:66%;max-width:920px;
  max-height:86vh;overflow-y:auto;
  background:var(--surface);
  border:1px solid var(--border-strong);
  transform:translateY(18px);
  transition:transform .35s cubic-bezier(.16,.8,.3,1);
}
.lightbox-overlay.open .lightbox-panel{transform:translateY(0);}
.lightbox-close{
  position:absolute;top:16px;right:16px;z-index:5;
  width:44px;height:44px;
  background:rgba(10,10,15,.55);
  border:1px solid var(--border-strong);
  color:#fff;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:border-color .2s ease, background .2s ease;
}
.lightbox-close:hover{border-color:var(--accent-light);background:rgba(10,10,15,.8);}
.lightbox-close svg{width:18px;height:18px;}
.lightbox-media{
  position:relative;width:100%;
  min-height:0;
  background:var(--bg-alt);
  overflow:auto;
  display:flex;
  align-items:center;
  justify-content:center;
}
.lightbox-media.portrait-916{
  aspect-ratio:auto;
}
.lightbox-media > img{
  width:auto !important;
  height:auto !important;
  max-width:100% !important;
  max-height:82vh !important;
  object-fit:contain;
  object-position:center;
  display:block;
}
.lightbox-media svg{width:100%;height:auto;display:block;}
.lightbox-media.video-media{
  aspect-ratio:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:0;
  max-height:82vh;
  background:var(--bg-alt);
}
.lightbox-media.video-media video{
  max-width:100%;
  max-height:82vh;
}
.lightbox-media.gallery{
  aspect-ratio:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:2px;
  max-height:72vh;
  overflow-y:auto;
}
.lightbox-media.gallery img{width:100%;height:100%;object-fit:contain;background:var(--bg-alt);display:block;}
@media (max-width:620px){
  .lightbox-media.gallery{grid-template-columns:1fr;max-height:60vh;}
}
.lightbox-media .lb-tag{
  position:absolute;top:18px;left:18px;
  background:var(--accent);color:#fff;
  font-family:var(--font-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  padding:7px 13px;
}
.lightbox-body{padding:36px clamp(24px,4vw,44px) 44px;}
.lightbox-eyebrow{
  font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent-light);
}
.lightbox-title{
  margin-top:14px;
  font-family:var(--font-head);font-weight:700;text-transform:uppercase;
  font-size:clamp(26px,3.6vw,42px);line-height:1.06;letter-spacing:-.01em;
}
.lightbox-desc{margin-top:16px;max-width:560px;color:var(--text-dim);font-size:15px;line-height:1.75;}
.lightbox-tags{margin-top:22px;display:flex;align-items:stretch;gap:9px;flex-wrap:wrap;}
.lightbox-tags span,
.lightbox-youtube{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:42px;
  padding:0 18px;
  box-sizing:border-box;
  font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;
  text-transform:uppercase;
  white-space:nowrap;
}
.lightbox-tags span{
  border:1px solid var(--border-strong);color:var(--text-dim);
}
.lightbox-youtube{
  gap:9px;
  margin-top:0;
  background:var(--accent);color:#fff;
  border:1px solid var(--accent);
  transition:background .18s ease,border-color .18s ease,transform .18s ease;
}
.lightbox-youtube:hover{background:var(--accent-light);border-color:var(--accent-light);transform:translateY(-1px);}


@media (max-width:820px){
  .lightbox-panel{width:100%;max-height:90vh;}
  .lightbox-overlay{padding:24px 14px;}
}

/* ============ SKILLS ============ */
.skill-cards{
  display:grid;grid-template-columns:repeat(4,1fr);gap:18px;
  margin-bottom:60px;
}
.skill-card{
  background:var(--surface);border:1px solid var(--border);
  padding:26px 22px;
  transition:border-color .2s ease, transform .2s ease;
}
.skill-card:hover{border-color:var(--accent-line);transform:translateY(-3px);}
.skill-card .icon{
  width:42px;height:42px;background:var(--accent-soft);border:1px solid var(--accent-line);
  display:flex;align-items:center;justify-content:center;color:var(--accent-light);
  border-radius:2px;
}
.skill-card .icon svg{width:20px;height:20px;}
.skill-card h4{
  margin-top:18px;font-family:var(--font-head);font-weight:600;font-size:16px;
  text-transform:uppercase;letter-spacing:.02em;
}
.skill-card p{margin-top:8px;font-size:13.5px;color:var(--text-dim);line-height:1.6;}

.software-block{
  display:grid;grid-template-columns:340px 1fr;gap:56px;
  align-items:start;
}
.software-copy h3{
  font-family:var(--font-head);font-weight:700;text-transform:uppercase;
  font-size:clamp(22px,2.6vw,28px);letter-spacing:-.01em;
}
.software-copy p{margin-top:16px;color:var(--text-dim);font-size:14.5px;line-height:1.7;max-width:320px;}
.badge{
  margin-top:26px;
  display:flex;align-items:center;gap:14px;
  background:var(--accent-soft);border:1px solid var(--accent-line);
  padding:16px 18px;
}
.badge .icon{color:var(--accent-light);flex:none;}
.badge .icon svg{width:22px;height:22px;}
.badge span{font-family:var(--font-mono);font-size:12px;letter-spacing:.02em;color:var(--text);line-height:1.5;}

.tool-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:0 40px;
}
.tool-item{padding:16px 0;border-bottom:1px solid var(--border);}
.tool-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
.tool-name{
  display:flex;align-items:center;gap:10px;
  font-family:var(--font-head);font-weight:600;font-size:13.5px;
  text-transform:uppercase;letter-spacing:.03em;
}
.tool-name .dot{width:7px;height:7px;background:var(--accent);flex:none;}
.tool-pct{font-family:var(--font-mono);font-size:12px;color:var(--accent-light);}
.bar-track{height:4px;background:var(--surface-2);width:100%;overflow:hidden;}
.bar-fill{
  height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-light));
  width:0%;transition:width 1.1s cubic-bezier(.16,.8,.3,1);
}

@media (max-width:980px){
  .skill-cards{grid-template-columns:repeat(2,1fr);}
  .software-block{grid-template-columns:1fr;gap:32px;}
  .software-copy p{max-width:none;}
}
@media (max-width:560px){
  .skill-cards{grid-template-columns:1fr;}
  .tool-grid{grid-template-columns:1fr;}
}

.contact-banner{
  margin:120px 0 0;
}
.cta-banner{

  align-items:flex-end;

.cta-banner::before{

.cta-left{position:relative;z-index:1;max-width:640px;}
.cta-tag{
  font-family:var(--font-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.82);margin-bottom:14px;
}
.cta-left h3{
  font-family:var(--font-head);font-weight:700;text-transform:uppercase;color:#fff;
  font-size:clamp(28px,4.4vw,46px);line-height:1.05;letter-spacing:-.01em;

.cta-left .btn{margin-top:26px;background:#0A0A0F;color:#fff;}
.cta-left .btn:hover{background:#17171f;}
.cta-right{position:relative;z-index:1;text-align:right;color:#fff;}
.cta-right .line{font-family:var(--font-head);font-weight:500;font-size:15px;margin-bottom:6px;}
.social-row{display:flex;gap:10px;}
.social-row a{
  width:44px;height:44px;border:1px solid var(--border-strong);
  display:flex;align-items:center;justify-content:center;
  transition:border-color .18s ease, color .18s ease, background .18s ease;
  color:var(--text-dim);

.social-row a svg{width:17px;height:17px;}
.social-row a:hover{border-color:var(--accent);color:var(--accent-light);background:var(--accent-soft);}
.cta-right .social-row{justify-content:flex-end;margin-top:16px;}
.cta-right .social-row a{border-color:rgba(255,255,255,.3);color:#fff;}
.cta-right .social-row a:hover{background:rgba(255,255,255,.15);border-color:#fff;}

@media (max-width:700px){
  .contact-banner{margin-top:88px;}

  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" ${extra}>${ICONS[name]||""}</svg>`;
}

/* project thumbnail generator — real image if provided, else abstract SVG placeholder per motif */
function projectThumb(p){
  if(p.images && p.images.length){
    return `<img src="${p.images[0]}" alt="${p.title} thumbnail" loading="lazy" style="object-position:${p.imgPosition||'center'};">`;
  }
  const [c1,c2] = p.palette;
  const gid = 'g' + Math.random().toString(36).slice(2,8);
  let inner = "";
  switch(p.motif){
    case "diamond":
      inner = `<polygon points="150,40 230,150 150,260 70,150" fill="none" stroke="#e9d9ff" stroke-width="2" opacity="0.85"/>
        <text x="150" y="150" text-anchor="middle" font-family="Oswald, sans-serif" font-size="26" fill="#f3e9ff" font-weight="600">${p.title.split(' ')[0]}</text>`;
      break;
    case "mono":
      inner = `<rect x="90" y="70" width="120" height="140" fill="none" stroke="#e9d9ff" stroke-width="1.4" opacity="0.7"/>
        <line x1="105" y1="95" x2="105" y2="190" stroke="#e9d9ff" stroke-width="1.4" opacity="0.6"/>
        <line x1="120" y1="105" x2="195" y2="105" stroke="#e9d9ff" stroke-width="1.4" opacity="0.6"/>`;
      break;
    case "bloom":
      inner = `<g opacity="0.85" fill="none" stroke="#ffb4c6" stroke-width="1.3">
        <circle cx="220" cy="70" r="26"/>
        <path d="M90 240 C120 190 140 180 170 160" />
        <path d="M110 250 C140 210 150 190 190 170" />
        <path d="M70 220 C100 180 120 175 150 150" />
        </g>`;
      break;
    case "phone":
      inner = `<rect x="118" y="40" width="64" height="128" rx="10" fill="#0d0b14" stroke="#e9d9ff" stroke-width="1.5" opacity="0.9"/>`;
      break;
    case "screen":
      inner = `<rect x="50" y="60" width="200" height="120" rx="4" fill="#0d0b14" stroke="#e9d9ff" stroke-width="1.4" opacity="0.85"/>
        <rect x="66" y="76" width="80" height="10" fill="#e9d9ff" opacity="0.6"/>
        <rect x="66" y="94" width="140" height="6" fill="#e9d9ff" opacity="0.3"/>
        <rect x="66" y="106" width="110" height="6" fill="#e9d9ff" opacity="0.3"/>`;
      break;
    case "dash":
      inner = `<g stroke="#e9d9ff" stroke-width="1.4" fill="none" opacity="0.75">
        <rect x="60" y="60" width="80" height="50"/>
        <rect x="160" y="60" width="80" height="50"/>
        <rect x="60" y="130" width="80" height="50"/>
        <rect x="160" y="130" width="80" height="50"/>
        </g>`;
      break;
    case "track":
      inner = `<text x="150" y="160" text-anchor="middle" font-family="Oswald, sans-serif" font-size="40" fill="#f3e9ff" font-weight="700" opacity="0.92">TRACK</text>
        <line x1="60" y1="80" x2="60" y2="220" stroke="#e9d9ff" stroke-width="1" opacity="0.4"/>
        <line x1="240" y1="80" x2="240" y2="220" stroke="#e9d9ff" stroke-width="1" opacity="0.4"/>`;
      break;
    case "orb":
      inner = `<g opacity="0.9">
        <ellipse cx="130" cy="140" rx="26" ry="40" fill="#c9a6ff" transform="rotate(-20 130 140)"/>
        <ellipse cx="175" cy="120" rx="22" ry="34" fill="#a98cff" transform="rotate(15 175 120)"/>
        <ellipse cx="160" cy="175" rx="20" ry="30" fill="#8c52ff" transform="rotate(40 160 175)"/>
        </g>`;
      break;
    default:
      inner = "";
  }
  return `<svg viewBox="0 0 300 300" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${p.title} thumbnail">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/>
    </linearGradient></defs>
    <rect width="300" height="300" fill="url(#${gid})"/>
    ${inner}
  </svg>`;
}

/* =========================================================
   BEHAVIOUR
   ========================================================= */
function initMobileNav(){
  const toggle = document.getElementById('navToggle');
  const panel = document.getElementById('mobilePanel');
  toggle.addEventListener('click', () => {
    const open = panel.classList.toggle('open');
    toggle.classList.toggle('open', open);
    toggle.setAttribute('aria-expanded', open ? 'true':'false');
    document.body.style.overflow = open ? 'hidden' : '';
  });
  panel.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
    panel.classList.remove('open');
    toggle.classList.remove('open');
    toggle.setAttribute('aria-expanded','false');
    document.body.style.overflow = '';
  }));
}

function initFilters(){
  const bar = document.getElementById('filterBar');
  const cards = () => document.querySelectorAll('.project-card');
  bar.addEventListener('click', (e) => {
    const btn = e.target.closest('.filter-btn');
    if(!btn) return;
    bar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const key = btn.dataset.filter;
    cards().forEach(card => {
      const match = key === 'all' || card.dataset.category === key;
      card.classList.toggle('hidden', !match);
    });
  });
}

function initReveal(){
  const els = document.querySelectorAll('.reveal, .reveal-stagger > *');
  if(!('IntersectionObserver' in window)){
    els.forEach(el => el.classList.add('is-visible'));
    return;
  }
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        entry.target.classList.add('is-visible');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -60px 0px' });
  els.forEach(el => io.observe(el));
}

function initBars(){
  const bars = document.querySelectorAll('.bar-fill');
  if(!('IntersectionObserver' in window)){
    bars.forEach(b => b.style.width = b.dataset.pct + '%');
    return;
  }
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        entry.target.style.width = entry.target.dataset.pct + '%';
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.4 });
  bars.forEach(b => io.observe(b));
}

/* Lightbox: click a project card for a large, detailed stacked view */
function openLightbox(index){
  const p = SITE_DATA.work.projects[index];
  if(!p) return;
  const mediaEl = document.getElementById('lightboxMedia');
  mediaEl.classList.remove('portrait-916');
  if(p.video){
    mediaEl.classList.remove('gallery');
    mediaEl.classList.add('video-media');
    mediaEl.innerHTML = `<span class="lb-tag">${p.client}</span><video controls playsinline preload="metadata" poster="${p.images?.[0] || ''}" style="width:auto;height:auto;max-width:100%;max-height:82vh;display:block;object-fit:contain;background:var(--bg-alt);margin:0 auto;"><source src="${p.video}" type="video/mp4">Your browser does not support embedded video playback.</video>`;
  } else if(p.images && p.images.length > 1){
    mediaEl.classList.remove('video-media');
    mediaEl.classList.add('gallery');
    mediaEl.innerHTML = `<span class="lb-tag">${p.client}</span>` +
      p.images.map(src => `<img src="${src}" alt="${p.title}" loading="lazy" style="object-position:${p.imgPosition||'center'};">`).join("");
  } else if(p.images && p.images.length === 1){
    mediaEl.classList.remove('gallery','video-media');
    if(p.aspect === '9/16') mediaEl.classList.add('portrait-916');
    mediaEl.innerHTML = `<span class="lb-tag">${p.client}</span><img src="${p.images[0]}" alt="${p.title}" loading="lazy" style="width:auto;height:auto;max-width:100%;max-height:82vh;object-fit:contain;object-position:${p.imgPosition||'center'};background:var(--bg-alt);display:block;">`;
  } else {
    mediaEl.classList.remove('gallery','video-media');
    mediaEl.innerHTML = `<span class="lb-tag">${p.client}</span>${projectThumb(p)}`;
  }
  document.getElementById('lightboxClient').textContent = `${p.client} — ${p.year}`;
  document.getElementById('lightboxTitle').textContent = p.title;
  document.getElementById('lightboxDesc').textContent = p.desc || "";
  document.getElementById('lightboxTags').innerHTML = p.tags.map(t => `<span>${t}</span>`).join("") + (p.youtube ? `<a class="lightbox-youtube" href="${p.youtube}" target="_blank" rel="noopener noreferrer">Watch on YouTube →</a>` : "");

  const overlay = document.getElementById('lightboxOverlay');
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('lightboxClose').focus();
}
function closeLightbox(){
  document.getElementById('lightboxOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
function initLightbox(){
  const grid = document.getElementById('workGrid');
  grid.addEventListener('click', (e) => {
    const card = e.target.closest('.project-card');
    if(!card) return;
    openLightbox(Number(card.dataset.index));
  });
  grid.addEventListener('keydown', (e) => {
    if(e.key !== 'Enter' && e.key !== ' ') return;
    const card = e.target.closest('.project-card');
    if(!card) return;
    e.preventDefault();
    openLightbox(Number(card.dataset.index));
  });
  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  document.getElementById('lightboxOverlay').addEventListener('click', (e) => {
    if(e.target.id === 'lightboxOverlay') closeLightbox();
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') closeLightbox();
  });
}
